<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<title>Macro</title>
<style>
:root{--bg:#fff;--ink:#000;--mute:#555;--line:#ccc;--red:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mute:#aaa;--line:#444;--red:#ff5a6e}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mute:#aaa;--line:#444;--red:#ff5a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
.label{border:2px solid var(--ink);padding:8px 10px}
h1{font-size:34px;font-weight:900;letter-spacing:-1px;margin:0;line-height:1.05}
.nav{display:flex;align-items:center;justify-content:space-between;border-bottom:10px solid var(--ink);padding:4px 0 6px}
.nav b{font-weight:700}
button{font:inherit;color:var(--ink);background:none;border:2px solid var(--ink);padding:8px 12px;cursor:pointer;font-weight:700}
button.solid{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.nav button{border:0;font-size:22px;padding:2px 10px}
.kcal{display:flex;justify-content:space-between;align-items:baseline;border-bottom:6px solid var(--ink);padding:6px 0}
.kcal span{font-size:15px}.kcal strong{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1}
.kcal small{font-size:15px;color:var(--mute);font-weight:400;letter-spacing:0}
.row{padding:7px 0;border-bottom:1px solid var(--ink)}
.row .top{display:flex;justify-content:space-between}
.row .top b{font-weight:900}
.bar{height:8px;background:var(--line);margin-top:5px}
.bar i{display:block;height:100%;background:var(--ink)}
.over .bar i,.over .top span{background:var(--red);color:var(--red)}
.over .top span{background:none}
h2{font-size:20px;font-weight:900;margin:22px 0 8px;letter-spacing:-.5px}
.form{display:grid;grid-template-columns:1fr 90px;gap:8px}
input{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);padding:9px;width:100%;border-radius:0}
.form button{grid-column:1/-1}
#cu{display:none;grid-column:1/-1;grid-template-columns:repeat(4,1fr);gap:6px}
#cu p{grid-column:1/-1;margin:0;font-size:14px;color:var(--mute)}
#cu input{padding:7px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
li div small{display:block;color:var(--mute);font-size:13px}
li button{border:0;font-size:20px;padding:4px 10px;color:var(--mute)}
.empty{color:var(--mute);padding:10px 0}
details{margin-top:22px;border-top:2px solid var(--ink);padding-top:10px}
summary{font-weight:900;font-size:18px;cursor:pointer}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tg label{font-size:14px;color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin-top:18px}
</style>
</head>
<body>
<main>
<div class="label">
  <h1>Valori nutrizionali</h1>
  <div class="nav"><button id="prev" aria-label="Giorno precedente">‹</button><b id="day"></b><button id="next" aria-label="Giorno successivo">›</button></div>
  <div class="kcal" id="kcal"><span>Calorie</span><strong></strong></div>
  <div id="rows"></div>
</div>

<h2>Aggiungi un alimento</h2>
<div class="form">
  <input id="n" list="foods" placeholder="Cerca o scrivi un alimento" autocomplete="off" aria-label="Alimento">
  <input id="g" type="number" inputmode="decimal" min="1" placeholder="Grammi" aria-label="Grammi">
  <div id="cu">
    <p>Alimento nuovo: inserisci i valori per 100 g.</p>
    <input id="ck" type="number" inputmode="decimal" placeholder="kcal" aria-label="Calorie per 100 g">
    <input id="cp" type="number" inputmode="decimal" placeholder="Prot." aria-label="Proteine per 100 g">
    <input id="cc" type="number" inputmode="decimal" placeholder="Carb." aria-label="Carboidrati per 100 g">
    <input id="cf" type="number" inputmode="decimal" placeholder="Grassi" aria-label="Grassi per 100 g">
  </div>
  <button class="solid" id="add">Aggiungi</button>
</div>
<datalist id="foods"></datalist>

<h2>Mangiato</h2>
<ul id="log"></ul>

<details>
  <summary>Obiettivi giornalieri</summary>
  <div class="tg">
    <div><label for="tk">Calorie</label><input id="tk" type="number" inputmode="numeric"></div>
    <div><label for="tp">Proteine (g)</label><input id="tp" type="number" inputmode="numeric"></div>
    <div><label for="tc">Carboidrati (g)</label><input id="tc" type="number" inputmode="numeric"></div>
    <div><label for="tf">Grassi (g)</label><input id="tf" type="number" inputmode="numeric"></div>
  </div>
  <button id="st">Salva obiettivi</button>
</details>
<p class="note">Valori medi per 100 g, indicativi: controlla l'etichetta del tuo prodotto. I dati restano su questo dispositivo.</p>
</main>
<script>
const $=s=>document.querySelector(s);
// nome, kcal, proteine, carboidrati, grassi (per 100 g)
const P=[["Pasta secca (cruda)",353,12,72,1.5],["Riso (crudo)",354,7,80,0.6],["Pane comune",265,8.5,58,0.4],["Fiocchi d'avena",372,13,60,7],["Patate",77,2,17,0.1],["Lenticchie secche",325,23,52,2],["Petto di pollo",110,23,0,1.2],["Uova (intere)",143,12.5,0.7,9.5],["Tonno al naturale",103,24,0,1],["Salmone",185,20,0,12],["Bresaola",151,32,0,2],["Prosciutto crudo",250,26,0,16],["Fiocchi di latte",98,11,3.4,4.3],["Yogurt greco 0%",57,10,4,0.2],["Latte parz. scremato",46,3.3,5,1.5],["Mozzarella",253,18,1,20],["Parmigiano Reggiano",392,33,0,28],["Olio extravergine",884,0,0,100],["Banana",89,1.1,20.8,0.3],["Mela",52,0.3,14,0.2]];
let S={};
try{S=JSON.parse(localStorage.getItem("macro1"))||{}}catch(e){}
S.t=S.t||{k:2270,p:150,c:260,f:70};S.l=S.l||{};S.u=S.u||[];
const save=()=>{try{localStorage.setItem("macro1",JSON.stringify(S))}catch(e){}};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let cur=new Date();
const all=()=>[...P,...S.u];
const find=n=>all().find(x=>x[0].toLowerCase()===n.toLowerCase());
const r=v=>Math.round(v*10)/10;
function foods(){$("#foods").innerHTML=all().map(x=>`<option value="${x[0].replace(/"/g,"&quot;")}">`).join("")}
function render(){
  const key=iso(cur),e=S.l[key]||[];
  $("#day").textContent=key===iso(new Date())?"Oggi":cur.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  const T=e.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0});
  const K=$("#kcal");K.querySelector("strong").innerHTML=`${Math.round(T.k)} <small>/ ${S.t.k}</small>`;
  K.className="kcal"+(T.k>S.t.k?" over":"");K.querySelector("strong").style.color=T.k>S.t.k?"var(--red)":"";
  $("#rows").innerHTML=[["Proteine","p"],["Carboidrati","c"],["Grassi","f"]].map(([l,k])=>`<div class="row"><div class="top"><b>${l}</b><span>${r(T[k])} g / ${S.t[k]} g</span></div><div class="bar"><i style="width:${Math.min(100,T[k]/S.t[k]*100)}%"></i></div></div>`).join("");
  $("#log").innerHTML=e.length?e.map((x,i)=>`<li><div>${x.n} · ${x.g} g<small>${Math.round(x.k)} kcal · P ${r(x.p)} · C ${r(x.c)} · G ${r(x.f)}</small></div><button data-i="${i}" aria-label="Elimina ${x.n}">✕</button></li>`).join(""):`<li class="empty">Nessun alimento. Aggiungine uno qui sopra.</li>`;
  ["k","p","c","f"].forEach(k=>$("#t"+k).value=S.t[k]);
}
$("#n").addEventListener("input",()=>{const v=$("#n").value.trim();$("#cu").style.display=v&&!find(v)?"grid":"none"});
$("#add").onclick=()=>{
  const n=$("#n").value.trim(),g=+$("#g").value;
  if(!n||!(g>0)){$("#n").focus();return}
  let f=find(n);
  if(!f){
    const v=["#ck","#cp","#cc","#cf"].map(s=>$(s).value);
    if(v.some(x=>x==="")){$("#ck").focus();return}
    f=[n,...v.map(Number)];S.u.push(f);foods();
    ["#ck","#cp","#cc","#cf"].forEach(s=>$(s).value="");$("#cu").style.display="none";
  }
  const m=g/100,key=iso(cur);
  (S.l[key]=S.l[key]||[]).push({n:f[0],g,k:f[1]*m,p:f[2]*m,c:f[3]*m,f:f[4]*m});
  save();$("#n").value="";$("#g").value="";render();
};
$("#log").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;S.l[iso(cur)].splice(+b.dataset.i,1);save();render()};
$("#prev").onclick=()=>{cur.setDate(cur.getDate()-1);render()};
$("#next").onclick=()=>{cur.setDate(cur.getDate()+1);render()};
$("#st").onclick=()=>{["k","p","c","f"].forEach(k=>{const v=+$("#t"+k).value;if(v>0)S.t[k]=v});save();render()};
foods();render();
</script>
</body>
</html>
